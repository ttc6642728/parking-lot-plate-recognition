name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    # 用 Windows 而不是 ubuntu：本项目是 Windows 桌面程序，
    # 且 onnxruntime 与 PyQt5 的 DLL 加载顺序在 Windows 上才有特殊性。
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 环境自检
        # 只打印诊断信息，不因缺少 Tesseract / YOLO 权重而失败
        run: python check_env.py || true

      - name: 运行单元测试
        # 失败时把关键行写进注解与 Job Summary，便于在网页上直接看到原因
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q --maxfail=1 2>&1 | tee pytest.log
          status=$?
          if [ $status -ne 0 ]; then
            detail=$(grep -E '^(FAILED|E  )' pytest.log | head -6 | tr '\n' ' ')
            echo "::error title=pytest 失败::${detail:-见 Job Summary}"
            { echo '### pytest 失败输出'; echo '```'; tail -60 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit $status
          fi

      - name: 识别准确率回归
        # 双引擎仲裁的核心指标：基础测试集 7 张必须全部识别正确
        run: python eval_recognition.py --mode auto --fail-below 1.0
