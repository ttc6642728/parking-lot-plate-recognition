name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    # 用 Windows 而不是 ubuntu：本项目是 Windows 桌面程序，
    # 且 onnxruntime 与 PyQt5 的 DLL 加载顺序在 Windows 上才有特殊性。
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 环境自检
        # 只打印诊断信息，不因缺少 Tesseract / YOLO 权重而失败
        run: python check_env.py || true

      - name: 运行单元测试
        run: python -m pytest tests -q --maxfail=1

      - name: 识别准确率回归
        # 双引擎仲裁的核心指标：基础测试集 7 张必须全部识别正确
        run: python eval_recognition.py --mode auto --fail-below 1.0
